name: Build APK

on:
  push:
    branches: [main]
    # Test tooling changes don't need a new app release.
    paths-ignore:
      - ".github/workflows/emulator.yml"
      - ".github/workflows/perf.yml"
      - ".github/workflows/trace.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build signed APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Report build errors
        if: failure()
        run: |
          { grep -E "^e: " build.log; grep -E -A6 "What went wrong" build.log; } | head -200 > errors.txt || true
          grep -E "Missing class|R8:|ERROR:" build.log | head -60 >> errors.txt || true
          cat app/build/outputs/mapping/release/missing_rules.txt >> errors.txt 2>/dev/null || true
          [ -s errors.txt ] || tail -60 build.log > errors.txt
          split -l 20 errors.txt part_
          for f in part_*; do
            msg=$(sed -e 's/%/%25/g' "$f" | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build errors ($f)::$msg"
          done

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk Marquee.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Marquee
          path: Marquee.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Marquee build ${{ github.run_number }}
          body: "Install on your TV with the Downloader app: https://github.com/${{ github.repository }}/releases/latest/download/Marquee.apk"
          files: Marquee.apk
          make_latest: true
