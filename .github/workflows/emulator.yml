name: Emulator test

# Runs the real release APK in an Android emulator set up like a 1080p TV, drives it with the
# remote's D-pad, screenshots every screen and collects the crash log. Started by hand.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        # A high build number so the app doesn't offer to "update" itself during the test.
        run: gradle :app:assembleRelease --no-daemon && cp app/build/outputs/apk/release/app-release.apk Marquee.apk
        env:
          VERSION_CODE: "100000"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: tv_1080p
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: false
          script: bash .github/scripts/emulator-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results
          path: emu/

      - name: Pack results
        if: always()
        run: cd emu && zip -qr ../emulator-results.zip .

      # Pre-release, so the app's self-updater (which only looks at the latest full release) ignores it.
      - name: Publish results
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: emulator-results-${{ github.run_number }}
          name: Emulator test ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: emulator-results.zip
