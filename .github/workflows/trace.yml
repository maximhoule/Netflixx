name: Trace

# Records Perfetto traces of the real release APK on an emulator and explains the slow frames.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon && cp app/build/outputs/apk/release/app-release.apk Marquee.apk
        env:
          VERSION_CODE: "100000"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Record traces on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: tv_1080p
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: false
          script: bash .github/scripts/trace.sh

      - name: Analyse
        if: always()
        run: |
          pip install perfetto >/dev/null
          python3 .github/scripts/trace_analysis.py trace trace/report.txt || true

      - name: Pack results
        if: always()
        run: cd trace && zip -qr ../trace-results.zip .

      - name: Publish results
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: trace-results-${{ github.run_number }}
          name: Trace ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: trace-results.zip
